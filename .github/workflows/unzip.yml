name: Unzip Uploaded Archive

on:
  push:
    paths:
      - '**.zip' # Triggers automatically whenever a .zip file is uploaded/pushed

jobs:
  unzip-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Zip File
        run: |
          # Finds the most recently added zip file in the repo
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            # Unzips the file into the repository directory (overwriting if needed)
            unzip -o "$ZIP_FILE" -d .
            
            # Optional: Delete the original zip file after extraction
            # rm "$ZIP_FILE"
          else
            echo "No zip file found."
          fi

      - name: Commit Extracted Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-unzip uploaded archive file"
          push_options: '--force'
          
